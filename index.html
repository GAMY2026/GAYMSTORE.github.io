<!-- CHECKOUT MODAL -->

<div class="checkout-overlay" id="checkoutOverlay">

    <div class="checkout-modal">

        <button class="checkout-close" id="closeCheckout">
            ×
        </button>

        <div class="checkout-header">

            <small>GAMY STORE</small>

            <h2>CHECKOUT</h2>

            <p>
                COMPLETE YOUR ORDER
            </p>

        </div>


        <form id="checkoutForm">

            <div class="checkout-field">

                <label>FULL NAME</label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="checkout-field">

                <label>PHONE NUMBER</label>

                <input
                    type="tel"
                    id="customerPhone"
                    placeholder="Enter your phone number"
                    required>

            </div>


            <div class="checkout-row">

                <div class="checkout-field">

                    <label>GOVERNORATE</label>

                    <input
                        type="text"
                        id="customerCity"
                        placeholder="Cairo"
                        required>

                </div>


                <div class="checkout-field">

                    <label>AREA</label>

                    <input
                        type="text"
                        id="customerArea"
                        placeholder="Area"
                        required>

                </div>

            </div>


            <div class="checkout-field">

                <label>FULL ADDRESS</label>

                <textarea
                    id="customerAddress"
                    placeholder="Street, building, apartment..."
                    required></textarea>

            </div>


            <div class="checkout-field">

                <label>ORDER NOTES</label>

                <textarea
                    id="orderNotes"
                    placeholder="Any special instructions?"></textarea>

            </div>


            <div class="checkout-summary">

                <div>

                    <span>ITEMS</span>

                    <strong id="checkoutItemsCount">
                        0
                    </strong>

                </div>


                <div>

                    <span>TOTAL</span>

                    <strong id="checkoutTotal">
                        0 EGP
                    </strong>

                </div>

            </div>


            <button
                type="submit"
                class="place-order-button">

                PLACE ORDER

            </button>

        </form>

    </div>

</div>
