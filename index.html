<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMY STORE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- الهيدر -->
    <header class="header">

        <div class="logo">
            GAMY STORE
        </div>

        <nav class="menu">
            <a href="#">الرئيسية</a>
            <a href="#products">المنتجات</a>
            <a href="#contact">تواصل معنا</a>
        </nav>

    </header>


    <!-- الواجهة الرئيسية -->
    <section class="hero">

        <div class="hero-content">

            <h1>GAMY STORE</h1>

            <p>
                أحدث صيحات الموضة بأسعار مناسبة
            </p>

            <a href="#products" class="hero-button">
                تسوق الآن
            </a>

        </div>

    </section>


    <!-- المنتجات -->
    <section class="products" id="products">

        <h2>منتجاتنا</h2>

        <p class="products-description">
            اكتشف أحدث منتجات GAMY STORE
        </p>

        <div class="products-container">

            <!-- المنتج الأول -->
            <div class="product-card">

                <div class="product-image">
                    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=85"
                        alt="تيشيرت رجالي">
                </div>

                <h3>تيشيرت رجالي</h3>

                <p class="price">350 جنيه</p>

                <button>اطلب الآن</button>

            </div>


            <!-- المنتج الثاني -->
            <div class="product-card">

                <div class="product-image">
                    <img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=700&q=85"
                        alt="قميص رجالي">
                </div>

                <h3>قميص رجالي</h3>

                <p class="price">500 جنيه</p>

                <button>اطلب الآن</button>

            </div>


            <!-- المنتج الثالث -->
            <div class="product-card">

                <div class="product-image">
                    <img src="https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=700&q=85"
                        alt="بنطلون رجالي">
                </div>

                <h3>بنطلون رجالي</h3>

                <p class="price">600 جنيه</p>

                <button>اطلب الآن</button>

            </div>

        </div>

    </section>


    <!-- التواصل -->
    <section class="contact" id="contact">

        <h2>تواصل معنا</h2>

        <p>
            للاستفسار والطلب تواصل معنا
        </p>

        <button>واتساب</button>

    </section>


    <!-- أسفل الصفحة -->
    <footer>

        <p>
            © 2026 GAMY STORE - جميع الحقوق محفوظة
        </p>

    </footer>

</body>

</html>
