<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMY STORE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- الشريط الأزرق -->
    <header class="header">

        <div class="logo">
            GAMY STORE
        </div>

        <nav class="menu">
            <a href="#">الرئيسية</a>
            <a href="#categories">الأقسام</a>
            <a href="#contact">تواصل معنا</a>
        </nav>

    </header>


    <!-- الواجهة الرئيسية -->
    <section class="hero">

        <div class="hero-content">

            <h1>GAMY STORE</h1>

            <p>
                أحدث صيحات الموضة بأسعار مناسبة
            </p>

            <a href="#categories" class="hero-button">
                تصفح الأقسام
            </a>

        </div>

    </section>


    <!-- الأقسام -->
    <section class="categories" id="categories">

        <h2>الأقسام</h2>

        <p class="categories-description">
            اختار القسم الذي تريد تصفحه
        </p>

        <div class="categories-container">

            <a href="#" class="category-card">

                <div class="category-image">
                    <div class="category-icon">👕</div>
                </div>

                <div class="category-info">
                    <h3>رجالي</h3>
                    <span>تصفح القسم</span>
                </div>

            </a>


            <a href="#" class="category-card">

                <div class="category-image">
                    <div class="category-icon">👗</div>
                </div>

                <div class="category-info">
                    <h3>حريمي</h3>
                    <span>تصفح القسم</span>
                </div>

            </a>


            <a href="#" class="category-card">

                <div class="category-image">
                    <div class="category-icon">👟</div>
                </div>

                <div class="category-info">
                    <h3>كوتشات</h3>
                    <span>تصفح القسم</span>
                </div>

            </a>

        </div>

    </section>


    <!-- التواصل -->
    <section class="contact" id="contact">

        <h2>تواصل معنا</h2>

        <p>
            للاستفسار والطلب تواصل معنا
        </p>

        <button>
            واتساب
        </button>

    </section>


    <!-- الفوتر -->
    <footer>

        <p>
            © 2026 GAMY STORE - جميع الحقوق محفوظة
        </p>

    </footer>


</body>

</html>
