<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMY STORE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- الهيدر -->
    <header class="header">

        <div class="logo">
            GAMY STORE
        </div>

        <nav class="menu">
            <a href="#">الرئيسية</a>
            <a href="#categories">الأقسام</a>
            <a href="#contact">تواصل معنا</a>
        </nav>

    </header>


    <!-- الواجهة الرئيسية -->
    <section class="hero">

        <div class="hero-content">

            <h1>GAMY STORE</h1>

            <p>
                اكتشف أحدث صيحات الموضة
            </p>

            <a href="#categories" class="hero-button">
                تصفح الأقسام
            </a>

        </div>

    </section>


    <!-- الأقسام -->
    <section class="categories" id="categories">

        <h2>تسوق حسب القسم</h2>

        <p class="categories-description">
            اختر القسم الذي تريد تصفحه
        </p>

        <div class="categories-container">


            <!-- رجالي -->
            <a href="#" class="category-card">

                <div class="category-image">

                    <img
                        src="https://images.unsplash.com/photo-1617137968427-85924c800a22?auto=format&fit=crop&w=800&q=85"
                        alt="ملابس رجالي">

                </div>

                <div class="category-info">
                    <h3>رجالي</h3>
                    <span>تصفح القسم</span>
                </div>

            </a>


            <!-- حريمي -->
            <a href="#" class="category-card">

                <div class="category-image">

                    <img
                        src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=85"
                        alt="ملابس حريمي">

                </div>

                <div class="category-info">
                    <h3>حريمي</h3>
                    <span>تصفح القسم</span>
                </div>

            </a>


            <!-- كوتشات -->
            <a href="#" class="category-card">

                <div class="category-image">

                    <img
                        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=85"
                        alt="كوتشات">

                </div>

                <div class="category-info">
                    <h3>كوتشات</h3>
                    <span>تصفح القسم</span>
                </div>

            </a>


        </div>

    </section>


    <!-- التواصل -->
    <section class="contact" id="contact">

        <h2>تواصل معنا</h2>

        <p>
            للاستفسار والطلب تواصل معنا
        </p>

        <button>
            واتساب
        </button>

    </section>


    <!-- الفوتر -->
    <footer>

        <p>
            © 2026 GAMY STORE - جميع الحقوق محفوظة
        </p>

    </footer>

</body>

</html>
