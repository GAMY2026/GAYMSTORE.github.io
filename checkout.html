<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | GAMY STORE</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        /* ==============================
           HEADER
        ============================== */

        .checkout-header {
            background: #111;
            color: #fff;
            padding: 22px;
            text-align: center;
            border-bottom: 2px solid #c8a96b;
        }

        .checkout-header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 3px;
        }

        /* ==============================
           MAIN
        ============================== */

        .checkout-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .checkout-box {
            background: #fff;
            padding: 25px;
            border-radius: 10px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.08);
        }

        .checkout-box h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
        }

        /* ==============================
           FORM
        ============================== */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #c8a96b;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* ==============================
           CART ITEMS
        ============================== */

        .checkout-item {

            padding: 18px 0;

            border-bottom:
                1px solid #eee;
        }

        .checkout-item:last-child {
            border-bottom: none;
        }

        .checkout-item h3 {
            margin: 0 0 10px;
            font-size: 17px;
        }

        .checkout-item p {
            margin: 6px 0;
            color: #666;
            font-size: 14px;
        }

        .checkout-item-price {
            margin-top: 10px;

            font-weight: bold;

            color: #111;
        }

        /* ==============================
           TOTAL
        ============================== */

        .checkout-total {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 20px;

            padding-top: 20px;

            border-top:
                2px solid #c8a96b;

            font-size: 20px;

            font-weight: bold;
        }

        /* ==============================
           BUTTONS
        ============================== */

        .confirm-order {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            background: #111;

            color: #fff;

            border: 1px solid #c8a96b;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .confirm-order:hover {

            background: #c8a96b;

            color: #111;

        }

        .back-store {

            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 14px;

            background: #eee;

            color: #111;

            text-decoration: none;

            text-align: center;

            border-radius: 6px;

            font-weight: bold;
        }

        .back-store:hover {
            background: #ddd;
        }

        /* ==============================
           EMPTY CART
        ============================== */

        .empty-cart {

            text-align: center;

            padding: 30px;

            color: #777;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 750px) {

            .checkout-container {

                grid-template-columns: 1fr;

                margin: 15px auto;

                padding: 12px;

            }

            .checkout-header h1 {
                font-size: 22px;
            }

        }

    </style>
</head>

<body>

    <!-- ==============================
         HEADER
    ============================== -->

    <header class="checkout-header">

        <h1>
            GAMY STORE
        </h1>

    </header>


    <!-- ==============================
         CHECKOUT
    ============================== -->

    <main class="checkout-container">


        <!-- ==============================
             CUSTOMER INFORMATION
        ============================== -->

        <section class="checkout-box">

            <h2>
                CUSTOMER INFORMATION
            </h2>


            <form id="checkoutForm">


                <div class="form-group">

                    <label for="customerName">
                        FULL NAME
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="customerPhone">
                        PHONE NUMBER
                    </label>

                    <input
                        type="tel"
                        id="customerPhone"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="customerCity">
                        GOVERNORATE
                    </label>

                    <input
                        type="text"
                        id="customerCity"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="customerArea">
                        AREA
                    </label>

                    <input
                        type="text"
                        id="customerArea"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="customerAddress">
                        FULL ADDRESS
                    </label>

                    <textarea
                        id="customerAddress"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="orderNotes">
                        ORDER NOTES
                    </label>

                    <textarea
                        id="orderNotes"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="confirm-order"
                >
                    CONFIRM ORDER
                </button>


            </form>

        </section>


        <!-- ==============================
             ORDER SUMMARY
        ============================== -->

        <section class="checkout-box">

            <h2>
                YOUR ORDER
            </h2>


            <div id="checkoutItems">

            </div>


            <div
                class="checkout-total"
                id="checkoutTotal"
            >

                <span>
                    TOTAL
                </span>

                <span>
                    0 EGP
                </span>

            </div>


            <a
                href="index.html"
                class="back-store"
            >
                BACK TO STORE
            </a>

        </section>


    </main>


    <!-- ==============================
         JAVASCRIPT
    ============================== -->

    <script>

        /* ==========================================
           CART STORAGE
        ========================================== */

        const CART_STORAGE_KEY =
            "gamyStoreCart";


        let cartItemsArray = [];


        /* ==========================================
           LOAD CART
        ========================================== */

        function loadCart() {

            try {

                const savedCart =
                    localStorage.getItem(
                        CART_STORAGE_KEY
                    );


                if (savedCart) {

                    const parsedCart =
                        JSON.parse(savedCart);


                    if (Array.isArray(parsedCart)) {

                        cartItemsArray =
                            parsedCart;

                    } else {

                        cartItemsArray = [];

                    }

                } else {

                    cartItemsArray = [];

                }

            } catch (error) {

                console.error(
                    "Could not load cart:",
                    error
                );

                cartItemsArray = [];

            }

        }


        /* ==========================================
           DISPLAY CART
        ========================================== */

        function displayCheckout() {

            loadCart();


            const container =
                document.getElementById(
                    "checkoutItems"
                );


            const totalElement =
                document.getElementById(
                    "checkoutTotal"
                );


            container.innerHTML = "";


            let total = 0;


            if (
                cartItemsArray.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty-cart">

                        <p>
                            YOUR CART IS EMPTY
                        </p>

                        <a href="index.html">
                            RETURN TO STORE
                        </a>

                    </div>

                `;


                totalElement.innerHTML = `

                    <span>
                        TOTAL
                    </span>

                    <span>
                        0 EGP
                    </span>

                `;


                return;

            }


            cartItemsArray.forEach(
                function(item) {


                    const price =
                        Number(item.price) || 0;


                    const quantity =
                        Number(item.quantity) || 1;


                    const itemTotal =
                        price * quantity;


                    total += itemTotal;


                    const itemElement =
                        document.createElement(
                            "div"
                        );


                    itemElement.className =
                        "checkout-item";


                    const name =
                        document.createElement(
                            "h3"
                        );


                    name.textContent =
                        item.name ||
                        "PRODUCT";


                    const color =
                        document.createElement(
                            "p"
                        );


                    color.textContent =
                        "COLOR: " +
                        (item.color || "-");


                    const size =
                        document.createElement(
                            "p"
                        );


                    size.textContent =
                        "SIZE: " +
                        (item.size || "-");


                    const quantityText =
                        document.createElement(
                            "p"
                        );


                    quantityText.textContent =
                        "QUANTITY: " +
                        quantity;


                    const priceText =
                        document.createElement(
                            "div"
                        );


                    priceText.className =
                        "checkout-item-price";


                    priceText.textContent =
                        itemTotal.toLocaleString() +
                        " EGP";


                    itemElement.appendChild(
                        name
                    );


                    itemElement.appendChild(
                        color
                    );


                    itemElement.appendChild(
                        size
                    );


                    itemElement.appendChild(
                        quantityText
                    );


                    itemElement.appendChild(
                        priceText
                    );


                    container.appendChild(
                        itemElement
                    );

                }
            );


            totalElement.innerHTML = `

                <span>
                    TOTAL
                </span>

                <span>
                    ${total.toLocaleString()} EGP
                </span>

            `;

        }


        /* ==========================================
           CONFIRM ORDER
        ========================================== */

        document
            .getElementById("checkoutForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    loadCart();


                    if (
                        cartItemsArray.length === 0
                    ) {

                        alert(
                            "YOUR CART IS EMPTY"
                        );

                        return;

                    }


                    const customerName =
                        document
                            .getElementById(
                                "customerName"
                            )
                            .value
                            .trim();


                    const customerPhone =
                        document
                            .getElementById(
                                "customerPhone"
                            )
                            .value
                            .trim();


                    const customerCity =
                        document
                            .getElementById(
                                "customerCity"
                            )
                            .value
                            .trim();


                    const customerArea =
                        document
                            .getElementById(
                                "customerArea"
                            )
                            .value
                            .trim();


                    const customerAddress =
                        document
                            .getElementById(
                                "customerAddress"
                            )
                            .value
                            .trim();


                    if (
                        !customerName ||
                        !customerPhone ||
                        !customerCity ||
                        !customerArea ||
                        !customerAddress
                    ) {

                        alert(
                            "PLEASE COMPLETE YOUR INFORMATION"
                        );

                        return;

                    }


                    alert(
                        "ORDER READY TO BE CONFIRMED"
                    );

                }
            );


        /* ==========================================
           START
        ========================================== */

        displayCheckout();

    </script>

</body>
</html>
